name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploy runs these checks too, so nothing is published without them.
  workflow_call:

# Grouped by the workflow that started the run, so the checks inside a deploy
# and CI's own run on the same commit can't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # Also type-checks: the build script runs `tsc` before `vite build`.
      - run: npm run build
