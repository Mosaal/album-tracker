name: Deploy

# Publishes the app to GitHub Pages. Release Please runs this when it creates
# a release, so the site always shows a released version. It can also be run
# by hand from the Actions tab: on main to publish it again, or on a version's
# tag, such as v0.7.0, to go back to that version.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deployment; queued runs collapse to the latest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same checks as pull requests, on exactly what's about to be published.
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
